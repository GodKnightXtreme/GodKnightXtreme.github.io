<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
  body {
    margin: 0;
    background: black;
    color: lime;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .box {
    padding: 25px;
    border: 2px solid lime;
    box-shadow: 0 0 20px lime;
    max-width: 90%;
    text-align: center;
  }

  .shake {
    animation: shake 0.1s infinite;
  }

  @keyframes shake {
    0% { transform: translate(1px,1px); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-1px); }
    75% { transform: translate(-1px,-2px); }
    100% { transform: translate(1px,-1px); }
  }

  .warning {
    color: red;
    font-weight: bold;
    animation: blink 0.2s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* glitch overlay */
  .glitch {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,0,0.05),
      rgba(0,255,0,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }

  /* battery */
  .battery {
    position: fixed;
    top: 10px;
    right: 10px;
    color: white;
    font-size: 14px;
    border: 1px solid white;
    padding: 5px 10px;
  }

  /* fake camera */
  .camera {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 160px;
    transform: translate(-50%, -50%);
    border: 2px solid red;
    display: none;
    background: rgba(255,0,0,0.1);
    color: red;
    text-align: center;
    padding-top: 60px;
  }

</style>
</head>

<body>

<div class="glitch"></div>

<div class="battery" id="battery">🔋 100%</div>

<div class="camera" id="camera">📸 FRONT CAMERA ACTIVE</div>

<div class="box" id="box">
  <h1>⚠ SYSTEM CHECK ⚠</h1>
  <p id="line">Initializing scan...</p>
  <p class="warning">DEVICE UNDER MONITORING</p>
  <p>...Just kidding 😂 Hacker Zone 😎</p>
</div>

<script>
const box = document.getElementById("box");
const battery = document.getElementById("battery");
const camera = document.getElementById("camera");
const line = document.getElementById("line");

let level = 100;

/* 🔋 Fake battery drain */
setInterval(() => {
  if (level > 1) level -= 1;
  battery.textContent = "🔋 " + level + "%";
}, 800);

/* 📸 Fake camera popup */
setTimeout(() => {
  camera.style.display = "block";
}, 3000);

/* 🐌 Lag + text chaos */
const fakeTexts = [
  "Scanning storage...",
  "Bypassing firewall...",
  "Encrypting memes...",
  "Accessing gallery...",
  "Injecting script..."
];

setTimeout(() => {
  box.classList.add("shake");

  let i = 0;
  let interval = setInterval(() => {
    line.textContent = fakeTexts[Math.floor(Math.random()*fakeTexts.length)];
    i++;

    if (i > 25) {
      clearInterval(interval);
      box.classList.remove("shake");
      line.textContent = "System stable again 😌";

      setTimeout(() => {
        alert("Relax 😂 Nothing happened. You just entered the Hacker Zone.");
      }, 1500);
    }
  }, 150);

}, 1000);

/* 🚨 Alarm sound */
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep() {
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 800;

  gain.gain.value = 0.05;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

/* continuous alarm */
setTimeout(() => {
  setInterval(beep, 300);
}, 2500);

</script>

</body>
</html>

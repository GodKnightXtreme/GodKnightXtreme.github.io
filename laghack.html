<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
  body {
    margin: 0;
    background: black;
    color: lime;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .box {
    padding: 25px;
    border: 2px solid lime;
    box-shadow: 0 0 20px lime;
    max-width: 90%;
    text-align: center;
  }

  .shake {
    animation: shake 0.1s infinite;
  }

  @keyframes shake {
    0% { transform: translate(1px,1px); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-1px); }
    75% { transform: translate(-1px,-2px); }
    100% { transform: translate(1px,-1px); }
  }

  .warning {
    color: red;
    font-weight: bold;
    animation: blink 0.2s infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .glitch {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,0,0.05),
      rgba(0,255,0,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }

  .hidden {
    display: none;
  }
</style>
</head>

<body>

<div class="glitch"></div>
<div class="battery" id="battery">🔋 100%</div>

<div class="box" id="box">
  <h1>⚠ SYSTEM HACK ⚠</h1>
  <p id="line">Initializing scan...</p>
  <p class="warning">DEVICE UNDER MONITORING</p>

  <!-- 👇 hidden initially -->
  <p id="joke" class="hidden">Just kidding 😂 Relax.....</p>
</div>

<script>
const box = document.getElementById("box");
const battery = document.getElementById("battery");
const line = document.getElementById("line");
const joke = document.getElementById("joke");

let level = 100;

/* fake text chaos */
const fakeTexts = [
  "Scanning storage...",
  "Bypassing firewall...",
  "Encrypting memes...",
  "Accessing gallery...",
  "Injecting script..."
];

/* 📳 vibration */
function vibratePattern() {
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
}

setTimeout(() => {
  box.classList.add("shake");

  let i = 0;

  let interval = setInterval(() => {
    line.textContent = fakeTexts[Math.floor(Math.random() * fakeTexts.length)];
    vibratePattern();

    i++;

    if (i > 25) {
      clearInterval(interval);
      box.classList.remove("shake");

      if (navigator.vibrate) navigator.vibrate(0);

      line.textContent = "System stable again 😌";

      setTimeout(() => {
        alert("Nothing happened 🤣. You just entered Shainil's Hacking Zone 😎");

        // 👇 show ONLY AFTER alert closes
        joke.classList.remove("hidden");

      }, 1500);
    }

  }, 150);

}, 1000);
</script>

</body>
</html>

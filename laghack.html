<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
  body {
    margin: 0;
    background: black;
    color: lime;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .box {
    padding: 25px;
    border: 2px solid lime;
    box-shadow: 0 0 20px lime;
    max-width: 90%;
    text-align: center;
    transition: filter 0.1s;
  }

  .shake {
    animation: shake 0.1s infinite;
  }

  @keyframes shake {
    0% { transform: translate(1px,1px); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-1px); }
    75% { transform: translate(-1px,-2px); }
    100% { transform: translate(1px,-1px); }
  }

  .warning {
    color: red;
    font-weight: bold;
    animation: blink 0.2s infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .glitch {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,0,0.05),
      rgba(0,255,0,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }

  .hidden {
    display: none;
  }

  #startBtn {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 15px;
    background: lime;
    border: none;
    font-family: monospace;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="glitch"></div>

<button id="startBtn">START SYSTEM</button>

<div class="box" id="box">
  <h1>⚠ SYSTEM HACK ⚠</h1>
  <p id="line">Waiting for activation...</p>
  <p class="warning">DEVICE UNDER MONITORING</p>

  <p id="joke" class="hidden">Just kidding 😂 Relax.....</p>
</div>

<script>
const box = document.getElementById("box");
const line = document.getElementById("line");
const joke = document.getElementById("joke");
const startBtn = document.getElementById("startBtn");

const fakeTexts = [
  "Scanning storage...",
  "Bypassing firewall...",
  "Encrypting memes...",
  "Accessing gallery...",
  "Injecting script...",
  "Stealing cookies... (just fake 😄)"
];

function vibratePattern() {
  if (navigator.vibrate) {
    navigator.vibrate([120, 60, 120]);
  }
}

startBtn.addEventListener("click", () => {
  startBtn.style.display = "none";

  box.classList.add("shake");

  let i = 0;

  let interval = setInterval(() => {
    line.textContent = fakeTexts[Math.floor(Math.random() * fakeTexts.length)];

    // glitch color shift
    box.style.filter = `hue-rotate(${Math.random() * 50}deg)`;

    // vibration (random so it feels natural)
    if (Math.random() > 0.4) vibratePattern();

    i++;

    if (i > 25) {
      clearInterval(interval);

      box.classList.remove("shake");
      box.style.filter = "none";

      if (navigator.vibrate) navigator.vibrate(0);

      line.textContent = "System stable again 😌";

      setTimeout(() => {
        alert("Nothing happened 🤣. You just entered Shainil's Hacking Zone 😎");

        // show AFTER alert closes
        joke.classList.remove("hidden");

      }, 1500);
    }

  }, 150);
});
</script>

</body>
</html>
